<style>
/* SignalFlow player. Layout: masthead, then one wide player (diagram left, plain-English caption right). */
:root {
  --bg: #f2f4f3;
  --surface: #ffffff;
  --fg: #11201e;
  --muted: #5b6b68;
  --line: #d3dcd9;
  --teal: #0b8a79;
  --amber: #c9650a;
  --violet: #6a4fc4;
  --on-accent: #ffffff;
  --active-bg: rgba(11, 138, 121, .10);
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1716; --surface: #142321; --fg: #e5efed; --muted: #92a6a2; --line: #26403c;
    --teal: #3cc7b1; --amber: #f0a04b; --violet: #a493f0; --on-accent: #06201b; --active-bg: rgba(60, 199, 177, .13);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1716; --surface: #142321; --fg: #e5efed; --muted: #92a6a2; --line: #26403c;
  --teal: #3cc7b1; --amber: #f0a04b; --violet: #a493f0; --on-accent: #06201b; --active-bg: rgba(60, 199, 177, .13);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.mast { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 24px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.mast h1 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.1; letter-spacing: -.01em; }
.mast p { margin: 4px 0 0; color: var(--muted); }
.back { font-size: 13px; color: var(--teal); text-decoration: none; padding: 6px 0; }
.back:hover { text-decoration: underline; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.player { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.player-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 16px 18px 0; }
.player-head h2 { font-size: clamp(20px, 2.6vw, 26px); }
.stage { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.diagram { min-width: 0; padding: 8px 6px 0 10px; }
.diagram svg { display: block; width: 100%; height: auto; }
.side { min-width: 0; padding: 18px 20px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.chip { align-self: flex-start; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; }
.side h3 { font-size: 20px; line-height: 1.2; }
.side p { margin: 0; }
.msg { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; }
.spec { font-size: 12.5px; color: var(--muted); }
.spec code { font-family: var(--font-mono); color: var(--fg); }
.study { font-size: 12.5px; border: 1px dashed var(--amber); color: var(--amber); border-radius: 6px; padding: 6px 10px; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.btns { display: flex; gap: 6px; }
button, select {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; min-height: 36px; padding: 0 12px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--teal); }
button:focus-visible, select:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button.main { background: var(--teal); border-color: var(--teal); color: var(--on-accent); min-width: 84px; font-weight: 600; }
.scrub { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 10px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--teal); }
.time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.lane { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 5; }
.node rect { fill: var(--bg); stroke: var(--line); }
.node text { font-family: var(--font-display); font-weight: 700; font-size: 13px; fill: var(--fg); text-anchor: middle; }
.node .sub { font-family: var(--font-mono); font-weight: 400; font-size: 9.5px; fill: var(--muted); }
.band { fill: var(--active-bg); }
.arrow { stroke-width: 2.2; fill: none; stroke-linecap: round; }
.lbl { font-family: var(--font-mono); font-size: 10.5px; text-anchor: middle; fill: var(--fg); }
.num { font-family: var(--font-mono); font-size: 9.5px; fill: var(--muted); text-anchor: end; }

@media (max-width: 760px) {
  .stage { grid-template-columns: 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
}

.watch{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;border-top:1px solid var(--line)}
.watch .wl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.watch .wl svg{width:20px;height:20px;flex:none}
.watch a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;transition:.2s}
.watch a:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-2px)}
.watch a img{width:64px;height:36px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block}
.watch a{padding:5px 15px 5px 6px}
.watch a small{font-family:var(--font-mono);font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow">SignalFlow &middot; pastG</div>
      <h1>SignalFlow</h1>
      <p>From pastG, presentG to futureG.</p>
    </div>
    <a class="back" href="../index.html">&larr; All animations</a>
  </header>

  <section class="player" aria-labelledby="ptitle">
    <div class="player-head">
      <div>
        <div class="eyebrow">Animation 2 · Identifiers · Beginner</div>
        <h2 id="ptitle">Which ID does the phone answer to?</h2>
      </div>
    </div>
    <div class="stage">
      <div class="diagram"><svg id="svg" viewBox="0 0 720 548" role="img" aria-label="Animated sequence showing which RNTI is used at each stage between a UE and an eNodeB"></svg></div>
      <div class="side" aria-live="polite">
        <span class="chip" id="phase"></span>
        <div class="eyebrow" id="count"></div>
        <h3 id="title"></h3>
        <p id="body"></p>
        <div class="msg" id="msg"></div>
        <div class="spec" id="spec"></div>
        
      </div>
    </div>
    <div class="controls">
      <div class="btns">
        <button id="prev" aria-label="Previous step">&#9664;&#9664;</button>
        <button id="play" class="main">Pause</button>
        <button id="next" aria-label="Next step">&#9654;&#9654;</button>
        <button id="restart">Restart</button>
      </div>
      <div class="scrub">
        <input id="scrub" type="range" min="0" max="100" value="0" aria-label="Timeline">
        <span class="time" id="time"></span>
      </div>
      <label class="tag" for="speed">Speed
        <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
      </label>
    </div>
    <div class="watch"><span class="wl"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff0033" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8z"/><path fill="#fff" d="M9.8 15.5v-7l6 3.5z"/></svg>Prefer a story? Watch the school version.</span><a href="https://www.youtube.com/watch?v=b-LdS0Orp5U" target="_blank" rel="noopener"><img src="../assets/thumbs/b-LdS0Orp5U.jpg" alt="" width="64" height="36" loading="lazy">English<small>3:36</small></a><a href="https://www.youtube.com/watch?v=Bk0drNrcr8U" target="_blank" rel="noopener"><img src="../assets/thumbs/Bk0drNrcr8U.jpg" alt="" width="64" height="36" loading="lazy">हिन्दी<small>4:13</small></a></div>
  </section>
</div>
<script>window.FLOW = {"slug":"rnti-explained","title":"RNTI Explained | SignalFlow","description":"An animated tour of LTE RNTIs: which identifier the phone uses for broadcast, paging, random access and normal data.","generation":"pastG","status":"draft","order":2,"eyebrow":"Animation 2 · Identifiers · Beginner","heading":"Which ID does the phone answer to?","aria":"Animated sequence showing which RNTI is used at each stage between a UE and an eNodeB","stepSecs":2.8,"nodes":[{"id":"ue","name":"UE","sub":"Phone"},{"id":"enb","name":"eNodeB","sub":"E-UTRAN"}],"steps":[{"f":"enb","t":"ue","l":"PDCCH scrambled with SI-RNTI, then SIB on PDSCH","ph":"Broadcast and paging","c":"teal","title":"SI-RNTI: one fixed ID for everyone","body":"Every control message on the PDCCH has its CRC scrambled with an RNTI. A UE tries to decode with the RNTIs it cares about, and ignores the rest. System information is for all UEs, so it uses a fixed value, SI-RNTI = 0xFFFF.","spec":"TS 36.321 7.1"},{"f":"enb","t":"ue","l":"PDCCH scrambled with P-RNTI, then Paging","ph":"Broadcast and paging","c":"teal","title":"P-RNTI: the shared paging ID","body":"An idle UE wakes at its paging occasion and looks for P-RNTI = 0xFFFE. Every idle UE in the cell decodes that message. The paging message holds the target's identity (for example its S-TMSI), and only the matching UE reacts.","spec":"TS 36.321 7.1, TS 36.304"},{"f":"ue","t":"enb","l":"PRACH preamble (no RNTI yet)","ph":"Random access","c":"amber","title":"Not connected yet, so no ID of its own","body":"The UE has no C-RNTI, so it can't say who it is. It sends a preamble in a particular PRACH time and frequency slot. That slot is about to matter.","spec":"TS 36.321 5.1"},{"f":"enb","t":"ue","l":"PDCCH scrambled with RA-RNTI, then RAR","ph":"Random access","c":"amber","title":"RA-RNTI: derived from where the UE transmitted","body":"The reply is addressed to RA-RNTI = 1 + t_id + 10 x f_id, where t_id is the subframe and f_id the frequency slot of the preamble. The UE knows where it sent the preamble, so it can compute this. The RAR also hands out a Temporary C-RNTI.","spec":"TS 36.321 5.1.4"},{"f":"ue","t":"enb","l":"Msg3 PUSCH scrambled with Temporary C-RNTI","ph":"Random access","c":"amber","title":"The temporary ID is used right away","body":"Using the grant from the RAR, the UE sends its RRC connection request. This transmission is scrambled with the Temporary C-RNTI it was just given.","spec":"TS 36.211 5.3"},{"f":"enb","t":"ue","l":"PDCCH scrambled with Temp C-RNTI, then Msg4","ph":"Random access","c":"amber","title":"Contention resolution","body":"If two UEs picked the same preamble, they both received the same Temporary C-RNTI. Msg4 repeats the winner's identity. The UE that recognises itself keeps the Temporary C-RNTI, which becomes its C-RNTI. The other UE starts again.","spec":"TS 36.321 5.1.5"},{"f":"enb","t":"ue","l":"DL grant on PDCCH scrambled with C-RNTI","ph":"Connected","c":"violet","title":"C-RNTI: the UE's own ID in this cell","body":"From now on the eNodeB schedules this UE with its C-RNTI. It is unique within the cell while the UE is connected. Other UEs can't decode the grant, so they never read this data.","spec":"TS 36.321 7.1"},{"f":"enb","t":"ue","l":"UL grant (DCI 0) scrambled with C-RNTI","ph":"Connected","c":"violet","title":"The same ID schedules uplink too","body":"One C-RNTI covers both directions. For uplink, the eNodeB sends a grant telling the UE which resource blocks to use and what modulation to apply.","spec":"TS 36.213 8"},{"f":"enb","t":"ue","l":"DCI 3/3A scrambled with TPC-PUSCH-RNTI","ph":"Connected","c":"violet","title":"TPC-RNTI: one ID for a group","body":"Not every RNTI belongs to one UE. Power control commands can go to a group of UEs in one message, each one reading its own position in it. The group shares a TPC-PUCCH-RNTI or TPC-PUSCH-RNTI, assigned by RRC.","spec":"TS 36.212 5.3.3, TS 36.213 5.1"},{"f":"enb","t":"ue","l":"SPS activation scrambled with SPS C-RNTI","ph":"Connected","c":"violet","title":"SPS C-RNTI: for repeating resources","body":"Services like voice send small packets at regular intervals. Semi-persistent scheduling grants resources once and repeats them, so the eNodeB doesn't send a grant every 20 ms. Activation and release use a separate SPS C-RNTI.","spec":"TS 36.321 5.10"}],"outroSpeech":"That was the story of RNTI, the temporary and permanent IDs a phone uses. Follow SignalFlow for the next animation.","videos":{"intro":"Prefer a story? Watch the school version.","items":[["English","b-LdS0Orp5U","3:36"],["हिन्दी","Bk0drNrcr8U","4:13"]]}};</script>
<script>
/* SignalFlow player. Reads window.FLOW (see animations-src/README.md for the data format). */
(function () {
  var F = window.FLOW;
  var NS = "http://www.w3.org/2000/svg";
  var STEP_SECS = F.stepSecs || 2.4;
  var steps = F.steps, N = steps.length;
  var COLORS = { teal: "var(--teal)", amber: "var(--amber)", violet: "var(--violet)" };
  var ROW0 = 112, ROWH = 33;

  var X = {}, NAMES = {};
  F.nodes.forEach(function (n, i) {
    X[n.id] = F.nodes.length === 1 ? 360 : 90 + i * (540 / (F.nodes.length - 1));
    NAMES[n.id] = n.name;
  });

  var svg = document.getElementById("svg");
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  var bottom = ROW0 + (N - 1) * ROWH + 28;
  svg.setAttribute("viewBox", "0 0 720 " + (bottom + 20));

  F.nodes.forEach(function (n) {
    var x = X[n.id];
    el("line", { x1: x, y1: 62, x2: x, y2: bottom, "class": "lane" }, svg);
    var g = el("g", { "class": "node" }, svg);
    el("rect", { x: x - 56, y: 12, width: 112, height: 48, rx: 6 }, g);
    var t = el("text", { x: x, y: 33 }, g); t.textContent = n.name;
    var s = el("text", { x: x, y: 48, "class": "sub" }, g); s.textContent = n.sub || "";
  });
  var band = el("rect", { x: 4, y: 0, width: 712, height: ROWH - 4, rx: 4, "class": "band" }, svg);

  var rows = steps.map(function (s, i) {
    var y = ROW0 + i * ROWH;
    var g = el("g", {}, svg);
    var num = el("text", { x: 38, y: y + 4, "class": "num" }, g); num.textContent = i + 1;
    var x1 = X[s.f], x2 = X[s.t], col = COLORS[s.c];
    var line = el("line", { y1: y, y2: y, "class": "arrow", stroke: col }, g);
    var head = el("polygon", { fill: col }, g);
    var dot = el("circle", { r: 4.5, cy: y, fill: col }, g);
    var lbl = el("text", { x: (x1 + x2) / 2, y: y - 7, "class": "lbl" }, g); lbl.textContent = s.l;
    return { g: g, line: line, head: head, dot: dot, lbl: lbl, y: y, x1: x1, x2: x2, dir: x2 > x1 ? 1 : -1 };
  });

  function place(r, p, state) {
    var tip = r.x1 + (r.x2 - r.x1) * p, d = r.dir, y = r.y;
    r.line.setAttribute("x1", r.x1); r.line.setAttribute("x2", tip);
    r.head.setAttribute("points", tip + "," + y + " " + (tip - d * 9) + "," + (y - 4.5) + " " + (tip - d * 9) + "," + (y + 4.5));
    r.dot.setAttribute("cx", tip);
    r.dot.style.display = state === "active" && p < 0.98 ? "" : "none";
    r.head.style.display = p > 0 ? "" : "none";
    r.line.style.display = p > 0 ? "" : "none";
    r.g.style.opacity = state === "done" ? 0.5 : state === "active" ? 1 : 0.2;
    r.lbl.style.fontWeight = state === "active" ? 500 : 400;
  }

  var $ = function (id) { return document.getElementById(id); };
  var pos = 0, playing = true, speed = 1, last = null, shown = -1;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) playing = false;
  $("scrub").max = N * 100;

  function fmt(s) { s = Math.floor(s); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

  function render() {
    var idx = Math.min(Math.floor(pos), N - 1);
    var p = pos >= N ? 1 : pos - idx;
    rows.forEach(function (r, i) {
      if (i < idx) place(r, 1, "done");
      else if (i === idx) place(r, p, "active");
      else place(r, 0, "todo");
    });
    band.setAttribute("y", rows[idx].y - ROWH / 2 - 1);
    if (idx !== shown) {
      shown = idx;
      var s = steps[idx];
      var chip = $("phase"); chip.textContent = s.ph; chip.style.color = COLORS[s.c];
      $("count").textContent = "Step " + (idx + 1) + " of " + N;
      $("title").textContent = s.title;
      $("body").textContent = s.body;
      $("msg").textContent = NAMES[s.f] + " → " + NAMES[s.t] + "   " + s.l;
      $("spec").innerHTML = "Spec reference: <code>" + s.spec + "</code>";
    }
    $("scrub").value = Math.round(pos * 100);
    $("time").textContent = fmt(pos * STEP_SECS) + " / " + fmt(N * STEP_SECS);
    $("play").textContent = playing ? "Pause" : (pos >= N ? "Replay" : "Play");
  }

  function tick(ts) {
    if (last === null) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.1); last = ts;
    if (playing) {
      pos += dt * speed / STEP_SECS;
      if (pos >= N) { pos = N; playing = false; }
      render();
    }
    requestAnimationFrame(tick);
  }

  $("play").onclick = function () { if (pos >= N) pos = 0; playing = !playing; render(); };
  $("restart").onclick = function () { pos = 0; playing = true; render(); };
  $("prev").onclick = function () {
    playing = false;
    var i = Math.min(Math.floor(pos), N - 1);
    pos = (pos - i > 0.1) ? i : Math.max(0, i - 1);
    render();
  };
  $("next").onclick = function () { playing = false; pos = Math.min(N - 0.001, Math.floor(pos) + 1); render(); };
  $("scrub").oninput = function (e) { playing = false; pos = Math.min(N, e.target.value / 100); render(); };
  $("speed").onchange = function (e) { speed = parseFloat(e.target.value); };

  render();
  requestAnimationFrame(tick);
})();

</script>
